<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirPrinter Receive Only</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { max-width: 38rem; margin: 3rem auto; padding: 0 1rem; }
    main { border: 1px solid #8886; border-radius: 1rem; padding: 1.5rem; }
    h1 { margin-top: 0; }
    p { line-height: 1.5; }
    input, button { font: inherit; }
    input { display: block; width: 100%; margin: 1rem 0; }
    button { padding: .65rem 1rem; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 3rem; }
  </style>
</head>
<body>
  <main id="receiver" data-printer-path="__PRINTER_PATH__">
    <h1>Receive a File</h1>
    <p>This page only receives and saves a PDF or JPEG file. It does not print.</p>
    <p lang="zh">本页面仅接收并保存 PDF 或 JPEG 文件，不会打印。</p>
    <label for="document">Choose a PDF or JPEG file</label>
    <input id="document" type="file" accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg">
    <button id="upload" type="button">Upload and Save</button>
    <p id="status" role="status" aria-live="polite">Please choose a file.</p>
  </main>
  <script>
    (() => {
      const root = document.getElementById("receiver");
      const fileInput = document.getElementById("document");
      const button = document.getElementById("upload");
      const status = document.getElementById("status");
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();
      const path = root.dataset.printerPath;
      const MAX_DOCUMENT_BYTES = 64 * 1024 * 1024 - 4096;
      let nextRequestId = crypto.getRandomValues(new Uint32Array(1))[0] & 0x7fffffff;

      function requestId() {
        nextRequestId = (nextRequestId + 1) & 0x7fffffff;
        return nextRequestId || ++nextRequestId;
      }
      function u16(value) { return [(value >>> 8) & 255, value & 255]; }
      function join(parts) {
        const size = parts.reduce((sum, part) => sum + part.length, 0);
        const result = new Uint8Array(size);
        let offset = 0;
        for (const part of parts) { result.set(part, offset); offset += part.length; }
        return result;
      }
      function textAttribute(tag, name, value) {
        const nameBytes = encoder.encode(name);
        const valueBytes = encoder.encode(value);
        if (nameBytes.length > 255 || valueBytes.length > 65535) throw new Error("IPP attribute is too long.");
        return join([Uint8Array.of(tag), Uint8Array.from(u16(nameBytes.length)), nameBytes,
          Uint8Array.from(u16(valueBytes.length)), valueBytes]);
      }
      function integerAttribute(tag, name, value) {
        const nameBytes = encoder.encode(name);
        const data = new Uint8Array(4);
        new DataView(data.buffer).setInt32(0, value, false);
        return join([Uint8Array.of(tag), Uint8Array.from(u16(nameBytes.length)), nameBytes,
          Uint8Array.of(0, 4), data]);
      }
      function ippHeader(operation, id, printerUri, operationAttributes, jobAttributes) {
        const requestIdBytes = new Uint8Array(4);
        new DataView(requestIdBytes.buffer).setUint32(0, id, false);
        const parts = [Uint8Array.of(2, 0, (operation >>> 8) & 255, operation & 255), requestIdBytes,
          Uint8Array.of(1), textAttribute(0x47, "attributes-charset", "utf-8"),
          textAttribute(0x48, "attributes-natural-language", "en"),
          textAttribute(0x45, "printer-uri", printerUri), ...operationAttributes];
        if (jobAttributes.length) parts.push(Uint8Array.of(2), ...jobAttributes);
        parts.push(Uint8Array.of(3));
        return join(parts);
      }
      function parseResponse(bytes, expectedId) {
        if (bytes.length < 9) throw new Error("The print service returned an IPP response that is too short.");
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const statusCode = view.getUint16(2, false);
        if (view.getUint32(4, false) !== expectedId) throw new Error("The IPP response ID does not match the request.");
        if (statusCode >= 0x0400) throw new Error(`IPP request failed (status 0x${statusCode.toString(16)}).`);
        const attrs = {};
        let index = 8;
        let previousName = "";
        let ended = false;
        while (index < bytes.length) {
          const tag = bytes[index++];
          if (tag === 3) { ended = true; break; }
          if (tag < 0x10) { previousName = ""; continue; }
          if (index + 2 > bytes.length) throw new Error("Malformed IPP attribute name.");
          const nameLength = view.getUint16(index, false); index += 2;
          if (index + nameLength + 2 > bytes.length) throw new Error("Malformed IPP attribute.");
          if (nameLength) previousName = decoder.decode(bytes.subarray(index, index + nameLength));
          index += nameLength;
          const valueLength = view.getUint16(index, false); index += 2;
          if (index + valueLength > bytes.length) throw new Error("Malformed IPP attribute value.");
          const valueBytes = bytes.subarray(index, index + valueLength); index += valueLength;
          if (!previousName) continue;
          const value = (tag === 0x21 || tag === 0x23) && valueLength === 4
            ? new DataView(valueBytes.buffer, valueBytes.byteOffset, 4).getInt32(0, false)
            : decoder.decode(valueBytes);
          if (Object.prototype.hasOwnProperty.call(attrs, previousName)) {
            attrs[previousName] = Array.isArray(attrs[previousName])
              ? [...attrs[previousName], value] : [attrs[previousName], value];
          } else attrs[previousName] = value;
        }
        if (!ended) throw new Error("The IPP response is incomplete; the end-of-attributes tag is missing.");
        return attrs;
      }
      async function ippPost(url, header, file) {
        const body = file ? new Blob([header, file], { type: "application/ipp" }) : header;
        const response = await fetch(url, { method: "POST", headers: {
          "Content-Type": "application/ipp",
          "X-AirPrinter-Receive-Only": "1"
        }, body, cache: "no-store" });
        if (!response.ok) throw new Error(`AirPrinter returned HTTP ${response.status}.`);
        return response.arrayBuffer();
      }
      function formatFor(file) {
        const extension = file.name.toLowerCase().split(".").pop();
        const byExtension = extension === "pdf" ? "application/pdf"
          : (extension === "jpg" || extension === "jpeg") ? "image/jpeg" : null;
        const mime = file.type.toLowerCase();
        const byMime = mime === "application/pdf" ? "application/pdf"
          : (mime === "image/jpeg" || mime === "image/jpg") ? "image/jpeg" : null;
        if (byExtension && byMime && byExtension !== byMime) throw new Error("The file extension does not match its file type.");
        const format = byMime || byExtension;
        if (!format) throw new Error("Only PDF and JPEG files are supported.");
        return format;
      }
      async function pollJob(uri, jobId) {
        const requested = ["job-state", "job-state-reasons", "job-state-message"]
          .map((name, index) => textAttribute(0x44, index ? "" : "requested-attributes", name));
        for (let attempt = 0; attempt < 80; attempt++) {
          const id = requestId();
          const header = ippHeader(0x0009, id, uri, [integerAttribute(0x21, "job-id", jobId), ...requested], []);
          const attrs = parseResponse(new Uint8Array(await ippPost(`${path}/jobs/${jobId}`, header)), id);
          const stateValue = attrs["job-state"];
          const jobState = Array.isArray(stateValue) ? stateValue[stateValue.length - 1] : stateValue;
          const reasons = attrs["job-state-reasons"];
          const reason = Array.isArray(reasons) ? reasons.join(", ") : String(reasons || "");
          const message = String(attrs["job-state-message"] || "");
          if (jobState === 4 && reason.includes("job-hold-until-specified")
              && /diagnostic only/i.test(message) && /no Windows print submitted/i.test(message)
              && /Saved:/i.test(message)) return message;
          if (jobState === 7 || jobState === 8 || jobState === 9) {
            throw new Error(message || `The IPP job ended with status ${jobState}.`);
          }
          status.textContent = `File sent. Waiting for save confirmation (job ${jobId}, status ${jobState}).`;
          await new Promise(resolve => setTimeout(resolve, 500));
        }
        throw new Error("Timed out while waiting for save confirmation.");
      }
      button.addEventListener("click", async () => {
        if (button.disabled) return;
        const file = fileInput.files && fileInput.files[0];
        if (!file) { status.textContent = "Please choose a PDF or JPEG file first."; return; }
        button.disabled = true;
        fileInput.disabled = true;
        try {
          const format = formatFor(file);
          if (file.size > MAX_DOCUMENT_BYTES) throw new Error("The file exceeds the 64 MiB receive limit.");
          if (encoder.encode(file.name).length > 255) throw new Error("The file name is too long to send over IPP.");
          status.textContent = `Uploading ${file.name} (${file.size} bytes). Keep this page open.`;
          const printerUri = `${location.protocol === "https:" ? "ipps" : "ipp"}://${location.host}${path}`;
          const id = requestId();
          const jobName = textAttribute(0x42, "job-name", file.name);
          const documentFormat = textAttribute(0x49, "document-format", format);
          const header = ippHeader(0x0002, id, printerUri, [documentFormat], [jobName]);
          const attrs = parseResponse(new Uint8Array(await ippPost(path, header, file)), id);
          const jobId = attrs["job-id"];
          if (!Number.isInteger(jobId) || jobId < 1) throw new Error("The IPP response does not contain a valid job ID.");
          const saved = await pollJob(printerUri, jobId);
          status.textContent = `Received and saved. The file will not be printed.\n${saved}`;
        } catch (error) {
          status.textContent = `Receive failed.\n${error instanceof Error ? error.message : String(error)}`;
        } finally {
          button.disabled = false;
          fileInput.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
